name: Flutter CI — Format, Analyze & Test

# Manual only: nothing runs on push or pull request. Batch your changes, then
# run this once from Actions -> Flutter CI — Format, Analyze & Test -> Run
# workflow. That keeps small edits from spending a CI run each.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and first: a Flutter/AGP/Gradle split breaks the APK build minutes
  # later, and the error names the Gradle side, not the pin that moved. This
  # job fails in seconds with the numbers side by side.
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Flutter pins match the Android toolchain
        run: python3 tool/check_toolchain.py
      - name: The checker's own regression tests
        run: python3 test/toolchain_test.py

  ci:
    needs: toolchain
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.18.2
    with:
      # Pinned by .fvmrc: the app is verified on Flutter 3.50.0, and a stable
      # channel that moves under us is how the material deprecation broke this
      # job in the first place.
      flutter-channel: stable
      use-fvm: true
      working-directory: "."
      run-format-check: true
      run-analyze: true
      run-tests: true
      code-coverage: true
      build-apk: false
      build-aab: false
