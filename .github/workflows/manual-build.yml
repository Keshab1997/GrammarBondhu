name: Build Android APK or AAB (Manual)

# Actions -> Manual Android Build -> Run workflow. AAB requires signing secrets.
on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.18.0
    with:
      flutter-channel: stable
      # AGP 9.3.1 (what Flutter 3.50.0 asks for) is compiled against the JDK 21
      # API set, and its lint task dies on JDK 17 with
      # NoSuchMethodError: java.util.List.removeLast() while analysing
      # firebase_core. Build with 21 so the toolchain matches itself.
      java-version: "21"
      working-directory: "."
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      artifact-retention-days: 14
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      # Written to android/app/google-services.json before the build. The app is
      # guest-first, so an unset secret still builds — it just loses Google
      # sign-in.
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      # Optional for apps using ImgBB; extractable from the built APK/AAB.
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
