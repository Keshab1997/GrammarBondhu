name: grammar_bondhu
description: "GrammarBondhu — learn English grammar through interactive stories."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Lightweight state management — deliberately minimal for low-RAM devices.
  provider: ^6.1.2
  # Local persistence for settings + progress (offline-first, no backend).
  shared_preferences: ^2.3.0
  # Plays the pre-generated narration clips bundled in assets/audio/clips.
  # Pre-generated on purpose: device TTS voices differ per phone, so a bundled
  # clip is the only way every learner hears the same teacher.
  just_audio: ^0.9.42

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/manifest.json
    - assets/data/chapters/
    - assets/characters/
    - assets/foregrounds/
    - assets/backgrounds/
    - assets/illustrations/
    - assets/frames/
    - assets/branding/
    - assets/icons/
    - assets/audio/
    - assets/audio/clips/
  fonts:
    # A rounded display face for headings and the wordmark. Latin only — Bangla
    # and Hindi headings fall through to the Noto families below.
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-600.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-700.ttf
          weight: 700
    # Bundled, not borrowed from the OS: without these a phone with no Bengali
    # system font renders every Bangla string as tofu boxes.
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
