name: grammar_bondhu
description: "GrammarBondhu — learn English grammar through interactive stories."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Lightweight state management — deliberately minimal for low-RAM devices.
  provider: ^6.1.2
  # Local persistence for settings + progress (offline-first, no backend).
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/manifest.json
    - assets/data/chapters/
    - assets/characters/
    - assets/foregrounds/
    - assets/backgrounds/
    - assets/illustrations/
    - assets/frames/
    - assets/branding/
    - assets/icons/
    - assets/audio/
